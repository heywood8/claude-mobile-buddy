name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyse ${{ matrix.language }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            runner: ubuntu-latest
          # Swift analysis observes a real compile, so it needs a macOS runner.
          - language: swift
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4

      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@v3

      - if: matrix.language == 'java-kotlin'
        run: sdkmanager "platforms;android-37.1" "build-tools;37.0.0"

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      # Both languages are compiled, so CodeQL needs to watch a build rather than read files.
      - if: matrix.language == 'java-kotlin'
        working-directory: android
        run: ./gradlew assembleDebug

      - if: matrix.language == 'swift'
        working-directory: bridge
        run: swift build

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

# Replaces OSSAR, which was tried first and cannot run here at all: it reported "Found no
# applicable tools" and exited non-zero, because it bundles analysers for .NET and native
# binaries and has no Kotlin or Swift front end. A permanently red check that never looked at
# any of the code is worse than no check.
