name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      android_released: ${{ steps.release.outputs['android--release_created'] }}
      android_tag: ${{ steps.release.outputs['android--tag_name'] }}
    steps:
      # Two packages in one repository, so tags carry their component: android-v0.2.0 and
      # bridge-v0.2.0 move independently. A change to the protocol usually bumps both, which is
      # exactly what you want to see in the tag history.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  apk:
    name: Attach APK to the Android release
    needs: release-please
    if: needs.release-please.outputs.android_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-37.1" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # The release must not be debuggable: the app holds a pre-shared key that authorises
      # running commands on a workstation, and a debuggable build hands its own identity to
      # anyone with adb access. Publishing a debug APK here would undo that on the one page
      # people actually download from.
      - name: Decode the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set; refusing to publish an unsigned build" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Assemble
        working-directory: android
        env:
          CMB_STORE_FILE: ${{ runner.temp }}/release.jks
          CMB_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CMB_KEY_ALIAS: claude-buddy
          CMB_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # A build that quietly came out unsigned would be attached just as happily as a signed
      # one, and nobody would notice until an install failed. Check before publishing.
      - name: Verify it is signed and not debuggable
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | grep -q 'certificate DN' \
            || { echo "APK is not signed" >&2; exit 1; }
          if "$BT/aapt2" dump badging "$APK" | grep -q 'application-debuggable'; then
            echo "APK is debuggable" >&2
            exit 1
          fi
          "$BT/apksigner" verify --print-certs "$APK" | grep 'certificate DN'

      # R8 renames everything, so a stack trace from a published build is unreadable without
      # the mapping produced by that exact build — and it exists only on this runner. The
      # source is public, so the file gives away nothing that reading the repository would
      # not; it is compressed only because it is 33 MB of text.
      - name: Compress the mapping
        run: gzip -9 -c android/app/build/outputs/mapping/release/mapping.txt > "$RUNNER_TEMP/mapping.txt.gz"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.android_tag }}
        run: |
          gh release upload "$TAG" \
            android/app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/mapping.txt.gz" \
            --clobber

# The bridge is not attached to releases. A downloaded .app is quarantined by Gatekeeper unless
# it is signed and notarised, which needs a paid Developer ID; built from source it is not.
# See backlog.md.
