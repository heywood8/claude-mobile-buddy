name: OSSAR

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  ossar:
    name: Open Source Static Analysis Runner
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: github/ossar-action@v1
        id: ossar

      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.ossar.outputs.sarifFile }}

# Worth knowing what this does and does not do here. OSSAR bundles analysers aimed largely at
# .NET and native binaries; it has no Kotlin or Swift front end, so on this repository it is
# close to a no-op that reports success. It is kept because it was asked for, and because it
# costs nothing to leave running.
#
# The scanner that would actually read this codebase is CodeQL, which supports both Kotlin and
# Swift. Adding it is a separate decision, not something to slip in under this file's name.
