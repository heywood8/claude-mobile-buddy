name: PR title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional:
    name: Conventional commit
    runs-on: ubuntu-latest
    steps:
      # Pull requests land squashed, so the title becomes the commit message and release-please
      # reads it to decide the next version. A title it cannot parse means a release that
      # silently skips the change.
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            build
            ci
            chore
            perf
          scopes: |
            bridge
            android
            protocol
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" should start lowercase.
